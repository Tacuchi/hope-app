name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # compileSdk 37.2: el runner puede no traer esa plataforma.
      - name: Instalar la plataforma Android 37.2 si falta
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37.2" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null
          fi

      - name: Compilar, Lint y pruebas
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest :core:domain:test

      - name: Guardar reportes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            **/build/reports/
            **/build/test-results/
